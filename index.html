  <script>
let questionBank = {
  en: [],
  nl: [],
  fr: [],
  de: []
};

async function loadQuestionBank() {
  try {
    const response = await fetch(QUESTION_FILE + '?v=' + new Date().getTime());

    if (!response.ok) {
      throw new Error('Could not load ' + QUESTION_FILE + '. HTTP status: ' + response.status);
    }

    const data = await response.arrayBuffer();
    const workbook = XLSX.read(data, { type: 'array' });

    const loadedQuestionBank = {
      en: [],
      nl: [],
      fr: [],
      de: []
    };

    ['EN', 'NL', 'FR', 'DE'].forEach(sheetName => {
      const worksheet = workbook.Sheets[sheetName];
      if (!worksheet) {
        console.warn('Missing worksheet in ' + QUESTION_FILE + ':', sheetName);
        return;
      }

      const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
      const lang = sheetName.toLowerCase();

      rows.forEach(row => {
        if (!String(row.question || '').trim()) return;

        const options = [row.option1, row.option2, row.option3, row.option4]
          .map(value => String(value || '').trim())
          .filter(value => value.length > 0);

        const correct = String(row.correct || '')
          .split(',')
          .map(value => value.trim())
          .filter(value => value.length > 0)
          .map(value => Number(value))
          .filter(value => Number.isInteger(value));

        loadedQuestionBank[lang].push({
          type: String(row.type || 'single').trim().toLowerCase(),
          question: String(row.question || '').trim(),
          note: String(row.note || '').trim(),
          options,
          correct,
          explanation: String(row.explanation || '').trim()
        });
      });
    });

    questionBank = loadedQuestionBank;

    const missingLanguages = Object.entries(questionBank)
      .filter(([, questions]) => !questions.length)
      .map(([lang]) => lang.toUpperCase());

    if (missingLanguages.length) {
      throw new Error('No questions loaded for: ' + missingLanguages.join(', '));
    }

    console.log('Question bank loaded successfully from ' + QUESTION_FILE, questionBank);
  } catch (error) {
    console.error('Error loading ' + QUESTION_FILE, error);
    alert('The quiz questions could not be loaded from ' + QUESTION_FILE + '. Please check that ' + QUESTION_FILE + ' is in the same folder as index.html and contains sheets EN, NL, FR and DE.');
  }
}
